<svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792" role="img" aria-labelledby="title desc">
  <title id="title">Leadership Begins With Presence preview</title>
  <desc id="desc">Preview artwork styled to match Trusted Intent Leadership Brief number one.</desc>
  <rect width="612" height="792" fill="#ffffff"/>
  <text x="306" y="45" text-anchor="middle" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#b48b2a">TRUSTED INTENT</text>
  <text x="306" y="92" text-anchor="middle" font-family="Georgia,serif" font-size="29" font-weight="700" fill="#174875">Leadership Begins With Presence</text>
  <text x="306" y="124" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" font-weight="700" fill="#5d5d5d">LEADERSHIP BRIEF 01 • FROM TRUSTED INTENT</text>
  <rect x="58" y="140" width="229" height="13" fill="#b48b2a"/>
  <text x="306" y="151" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#b48b2a">★</text>
  <rect x="325" y="140" width="229" height="13" fill="#b48b2a"/>

  <g fill="#222" font-family="Georgia,serif">
    <text x="34" y="193" font-size="11.5">A few years ago, my son called me upstairs, excited to show me something he had built.</text>
    <text x="34" y="211" font-size="11.5" font-weight="700">Instead of seeing his excitement, I saw the flaw.</text>
    <text x="34" y="239" font-size="11.5">I corrected the problem before I acknowledged the person.</text>
  </g>

  <rect x="34" y="258" width="544" height="28" fill="#f6f2e8" stroke="#c79c2b"/>
  <text x="306" y="277" text-anchor="middle" font-family="Georgia,serif" font-size="12" font-weight="700" fill="#174875">Presence is more than being in the room. It is noticing what matters in the moment.</text>

  <text x="34" y="311" font-family="Georgia,serif" font-size="11.5" fill="#222">People know when we are distracted. They know when we are waiting to respond instead of listening.</text>

  <text x="49" y="348" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#174875">Questions for Reflection</text>
  <text x="330" y="348" font-family="Georgia,serif" font-size="13" font-weight="700" fill="#174875">Focus Area for Growth</text>

  <g fill="#b48b2a">
    <circle cx="51" cy="366" r="2.1"/><circle cx="51" cy="386" r="2.1"/><circle cx="51" cy="406" r="2.1"/><circle cx="51" cy="426" r="2.1"/>
    <circle cx="331" cy="366" r="2.1"/><circle cx="331" cy="386" r="2.1"/><circle cx="331" cy="406" r="2.1"/><circle cx="331" cy="426" r="2.1"/><circle cx="331" cy="446" r="2.1"/>
  </g>
  <g fill="#4d4d4d">
    <rect x="60" y="361" width="214" height="4" rx="2"/><rect x="60" y="370" width="190" height="4" rx="2"/>
    <rect x="60" y="381" width="212" height="4" rx="2"/><rect x="60" y="390" width="175" height="4" rx="2"/>
    <rect x="60" y="401" width="218" height="4" rx="2"/><rect x="60" y="410" width="198" height="4" rx="2"/>
    <rect x="60" y="421" width="215" height="4" rx="2"/><rect x="60" y="430" width="183" height="4" rx="2"/>
    <rect x="340" y="361" width="215" height="4" rx="2"/><rect x="340" y="370" width="185" height="4" rx="2"/>
    <rect x="340" y="381" width="190" height="4" rx="2"/>
    <rect x="340" y="401" width="214" height="4" rx="2"/>
    <rect x="340" y="421" width="201" height="4" rx="2"/>
    <rect x="340" y="441" width="219" height="4" rx="2"/><rect x="340" y="450" width="162" height="4" rx="2"/>
  </g>

  <text x="34" y="492" font-family="Georgia,serif" font-size="14" font-weight="700" fill="#174875">Before Your Next Important Conversation</text>
  <rect x="34" y="508" width="544" height="5" rx="2.5" fill="#3b3b3b"/>
  <rect x="34" y="521" width="516" height="5" rx="2.5" fill="#3b3b3b"/>

  <rect x="34" y="548" width="544" height="25" fill="#174875"/>
  <text x="306" y="565" text-anchor="middle" font-family="Georgia,serif" font-size="11.5" font-style="italic" fill="#fff">“Let every person be quick to hear, slow to speak, slow to anger.” — James 1:19</text>

  <text x="34" y="594" font-family="Georgia,serif" font-size="10.5" font-weight="700" fill="#b48b2a">ONE THOUGHT TO CARRY WITH YOU</text>
  <text x="306" y="622" text-anchor="middle" font-family="Georgia,serif" font-size="14.5" font-weight="700" fill="#174875">Leadership is often revealed in the small moments when people need to know</text>
  <text x="306" y="642" text-anchor="middle" font-family="Georgia,serif" font-size="14.5" font-weight="700" fill="#174875">that you see them.</text>

  <rect x="46" y="662" width="520" height="76" fill="#f1ede4"/>
  <text x="52" y="683" font-family="Georgia,serif" font-size="11" font-weight="700" fill="#b48b2a">CONTINUE THE JOURNEY</text>
  <text x="560" y="683" text-anchor="end" font-family="Georgia,serif" font-size="11" font-weight="700" fill="#174875">BLAKE GLASS</text>
  <rect x="52" y="696" width="430" height="4" rx="2" fill="#555"/>
  <rect x="52" y="706" width="390" height="4" rx="2" fill="#555"/>
  <rect x="52" y="719" width="304" height="5" rx="2.5" fill="#333"/>
  <rect x="46" y="738" width="520" height="9" fill="#174875"/>
